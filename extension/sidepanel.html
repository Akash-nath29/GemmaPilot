<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>GemmaPilot</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Flight deck: brand + live status readout -->
  <header class="deck">
    <div class="mark">
      <span class="mark__glyph" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="24" height="24">
          <circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45" />
          <path d="M14 4.5 L19.5 22 L14 18 L8.5 22 Z" fill="currentColor" />
        </svg>
      </span>
      <span class="mark__text">
        <span class="mark__name">Gemma<span class="mark__accent">Pilot</span></span>
        <span class="mark__tag">browser co-pilot</span>
      </span>
    </div>
    <div id="status" class="status status--off">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__label">offline</span>
    </div>
  </header>

  <!-- Telemetry feed -->
  <main id="log" class="log" aria-live="polite">
    <section class="preflight" id="empty-state">
      <p class="eyebrow eyebrow--jet">Pre-flight</p>
      <h1 class="preflight__title">Ready for your command.</h1>
      <p class="preflight__body">
        Tell me what to do on the tab you’re viewing. I’ll fly it one step at a
        time — and hold for your OK before anything you can’t undo.
      </p>
      <p class="eyebrow preflight__label">Flight plans to try</p>
      <div class="chips">
        <button class="chip" type="button" data-fill="Scroll down and click the second result">
          Scroll down &amp; click the second result
        </button>
        <button class="chip" type="button" data-fill="Fill this form with name Akash, email akash@example.com">
          Fill this form for me
        </button>
        <button class="chip" type="button" data-fill="Scroll to the References section">
          Scroll to a section
        </button>
        <button class="chip" type="button" data-fill="Book the second flight for Akash, email akash@example.com">
          Book the second flight
        </button>
      </div>
    </section>
  </main>

  <!-- Safety gate: amber caution annunciator -->
  <section id="gate" class="gate hidden" aria-live="assertive">
    <p class="eyebrow eyebrow--amber gate__title">
      <span class="gate__chevron" aria-hidden="true">⚠</span> Clearance required
    </p>
    <p class="gate__reason" id="gate-reason"></p>
    <div class="gate__target" id="gate-target" hidden></div>
    <div class="gate__actions">
      <button id="approve-btn" class="btn btn--go" type="button">Approve</button>
      <button id="deny-btn" class="btn btn--stop" type="button">Deny</button>
    </div>
  </section>

  <!-- Composer -->
  <footer class="composer">
    <textarea id="input" class="composer__input" rows="1"
              placeholder="Tell GemmaPilot what to do on this tab…"
              aria-label="Instruction"></textarea>
    <button id="run-btn" class="composer__send" type="button" aria-label="Run" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M3.2 11.3 20.5 3.1c.7-.3 1.4.4 1.1 1.1l-8.2 17.3c-.3.7-1.4.6-1.6-.2l-1.9-6.3-6.3-1.9c-.8-.2-.9-1.3-.2-1.6Z" fill="currentColor" />
      </svg>
    </button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
